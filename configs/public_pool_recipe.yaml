version: local-deltaavg-public-pool-v1
description: >
  Exact versioned public 20B-token STEM reasoning reference mixture used for
  every reported Local-DeltaAvg selection, CPT, SFT, and analysis result.

tokenizer:
  repo_id: Qwen/Qwen2.5-7B
  revision: d149729398750b98c0af14eb82c78cfe92750796
  add_eos_per_record: true
  record_min_tokens: 128
  record_max_tokens: 4096

ordering:
  algorithm: sha256
  key: source_id || record_id || "2027"

sources:
  - repo_id: open-thoughts/OpenThoughts3-1.2M
    revision: 61bcf9d4eb38b30295efc2021227a63cc5bb34c8
    target_tokens: 6000000000
    domains: [math, code, science]
  - repo_id: nvidia/OpenMathInstruct-2
    revision: 469216e3f46f4dacf476b382e192485ea51a143e
    target_tokens: 8000000000
    domains: [math]
  - repo_id: nvidia/OpenCodeReasoning
    revision: 20a1ca19c0d050fe9057fc08339d6b370ec1c67a
    target_tokens: 4000000000
    domains: [code]
  - repo_id: AI-MO/NuminaMath-1.5
    revision: 1b05109f9e5c1ad06c0663519502416c30b300f8
    target_tokens: 1500000000
    domains: [math]
  - repo_id: nvidia/Nemotron-Science-v1
    revision: 82e1af468197076b4f0f392c239274eac032adc7
    target_tokens: 500000000
    domains: [science]

normalization:
  unicode: NFKC
  whitespace: collapse
  canonicalize_chat_wrappers: true
  require_english_probability: 0.80
  require_question: true
  require_final_answer: true
  minimum_reasoning_units: 2
  reject_failed_dataset_verification: true

deduplication:
  exact_normalized_sha256: true
  minhash:
    permutations: 128
    shingles: normalized_word_or_code_5grams
    jaccard_threshold: 0.80
  component_representative_priority:
    - official_or_human_verified
    - execution_verified
    - answer_or_majority_verified
    - generated_unverified

decontamination:
  match: exact_contiguous_normalized_13_token_span
  compare_field: question
  benchmarks:
    - GSM8K_test
    - MATH500
    - AIME_2024
    - GPQA_Diamond
    - LiveCodeBench_evaluated_release

candidate_pool_tokens_after_filters: 20000000000
selection_budget_tokens: 2000000000

cpt:
  backbone_revision: d149729398750b98c0af14eb82c78cfe92750796
  full_parameter_training: true
  sequence_length: 4096
  global_tokens_per_update: 2097152
  updates: 954
  exact_training_tokens: 2000000000
  optimizer: adamw
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  weight_decay: 0.1
  gradient_clip: 1.0
  peak_learning_rate: 1.0e-5
  final_learning_rate: 1.0e-6
  warmup_fraction: 0.05
  scheduler: cosine
  precision: bf16
  optimizer_state_precision: fp32
  seeds: [17, 29, 43]
  checkpoint_every_updates: 100
  reported_checkpoint: final

same_sft:
  disjoint_from_candidate_pool: true
  target_tokens: 20000000
  maximum_records: 50000
  domain_token_shares:
    math: 0.60
    code: 0.25
    science: 0.15
  epochs: 1
  sequence_length: 4096
  global_tokens_per_update: 262144
  optimizer: adamw
  peak_learning_rate: 2.0e-5
  warmup_fraction: 0.05
  scheduler: cosine

evaluation:
  decoding: greedy
  temperature: 0
  bootstrap_replications: 5000
  bootstrap_unit: unique_problem_id_within_benchmark
